<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>时钟 · 日历</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body{
    height:100%;width:100%;
    overflow:hidden;color:#fff;
    font-family:-apple-system,"SF Pro Text",Roboto,"Noto Sans CJK SC","Noto Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
    background:#000;
  }
  #wrap{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;}
  #track{
    display:flex;width:200%;height:100%;
    transform:translateX(0);
    transition:transform .42s cubic-bezier(.22,.61,.36,1);
    will-change:transform;
  }
  .page{
    flex:0 0 50%;width:50%;height:100%;
    position:relative;
    display:flex;align-items:center;justify-content:center;
  }

  /* ===== 视图一：翻页钟（按参考图比例：卡片宽 22.7%、间距 3.6%、边距 12.4%、正方形）===== */
  .date-line{
    position:absolute;top:74px;left:0;right:0;
    text-align:center;
    font-size:26px;font-weight:400;color:#8E8E8E;
    letter-spacing:1px;
  }
  /* 与日期同一行的右端：第几周 */
  .week-line{
    position:absolute;top:74px;right:44px;
    font-size:26px;font-weight:400;color:#8E8E8E;
    letter-spacing:1px;
  }
  /* 与日期同一行的左端：星期 */
  .day-line{
    position:absolute;top:74px;left:44px;
    font-size:26px;font-weight:400;color:#8E8E8E;
    letter-spacing:1px;
  }
  .tiles{
    position:absolute;top:171px;left:74px;right:74px;
    height:258px;
    display:flex;justify-content:flex-start;
  }
  .tile{
    width:258px;height:258px;
    border-radius:30px;
    /* 卡片本体：上片像微微鼓起的弧面，下片往底边收暗 */
    background-image:
      repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0px,rgba(255,255,255,.012) 1px,rgba(255,255,255,0) 1px,rgba(255,255,255,0) 4px),
      linear-gradient(180deg,
        #272727 0%,
        #212121 6%,
        #1C1C1C 26%,
        #181818 44%,
        #151515 49.6%,
        #111111 50.6%,
        #131313 56%,
        #121212 80%,
        #0E0E0E 96%,
        #0B0B0B 100%);
    background-color:#1A1A1A;
    box-shadow:
      0 16px 30px rgba(0,0,0,.55),
      0 3px 6px rgba(0,0,0,.45),
      inset 0 1px 0 rgba(255,255,255,.10),
      inset 0 -3px 12px rgba(0,0,0,.55),
      inset 0 -1px 0 rgba(255,255,255,.045);
    position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .tile:nth-child(1){margin-right:41px;}
  .tile:nth-child(2){margin-right:41px;}
  /* 下片接住上片落的影 */
  .shade{
    position:absolute;left:0;right:0;top:50%;bottom:0;
    background:linear-gradient(180deg,rgba(0,0,0,.30) 0%,rgba(0,0,0,.16) 9%,rgba(0,0,0,.07) 22%,rgba(0,0,0,.025) 44%,rgba(0,0,0,.008) 66%,rgba(0,0,0,0) 100%);
    z-index:2;pointer-events:none;
  }
  /* 翻页缝：3px 深缝 + 1px 下沿亮线（纸卡边缘），压在数字上 */
  .seam{
    position:absolute;left:0;right:0;top:50%;
    height:4px;margin-top:-2px;
    background:linear-gradient(180deg,#040404 0%,#040404 75%,rgba(255,255,255,.075) 100%);
    z-index:3;pointer-events:none;
  }
  .digits{
    font-family:"sans-serif-condensed","Roboto Condensed",Roboto,sans-serif;
    font-weight:700;
    font-size:276px;
    line-height:1;
    letter-spacing:0;
    color:#D8D8D8;
    text-shadow:0 0 18px rgba(255,255,255,.05);
    font-variant-numeric:tabular-nums;
    position:relative;z-index:1;
    -webkit-transform:scaleX(.78);
    transform:scaleX(.78);
    -webkit-transform-origin:50% 50%;
    transform-origin:50% 50%;
  }
  .caption{
    position:absolute;top:505px;left:0;right:0;pointer-events:none;
    text-align:center;line-height:28px;
    font-size:24px;font-weight:400;color:#9C9C9C;
    letter-spacing:4px;
  }

  /* ===== 时钟左侧：倒计时快捷图标（开始 / 停止 / 设定时长），与底部公司名同一水平线 ===== */
  #cdQuick{
    position:absolute;left:16px;top:489px;z-index:20;
    height:60px;white-space:nowrap;
  }
  .icbtn{
    display:inline-block;width:84px;height:60px;
    margin-right:6px;text-align:center;
  }
  #cdQuick svg, #cdQuick svg *{pointer-events:none;}
  .icbtn svg{
    width:40px;height:40px;margin-top:10px;
    fill:none;stroke:rgba(255,255,255,.40);stroke-width:1.7;
    -webkit-transition:stroke .25s, opacity .25s;
    transition:stroke .25s, opacity .25s;
  }
  #qStart svg path{fill:rgba(255,255,255,.40);stroke:none;}
  #qStop svg rect{fill:rgba(255,255,255,.40);stroke:none;}
  #qStart.off svg path{fill:rgba(255,255,255,.13);}
  #qStop.off svg rect{fill:rgba(255,255,255,.13);}
  #qStart.on svg path{fill:#9C9C9C;}
  #qStop.on svg rect{fill:#9C9C9C;}
  #qSet.on svg{stroke:#9C9C9C;}

  /* ===== 倒计时：时钟页底部一行（默认很淡，点了才进面板） ===== */
  .cd-status{
    position:absolute;top:456px;left:0;right:0;height:44px;
    line-height:44px;text-align:center;
    font-family:"sans-serif-condensed",Roboto,sans-serif;
    font-size:19px;font-weight:400;color:#4C4C4C;
    letter-spacing:2px;
    z-index:6;
  }
  /* 运行中：提亮到 30px 白字，并在文字后面垫一条极淡的圆角底条，让它在黑底上浮起来 */
  .cd-status.run{
    color:#EDEDED;font-size:30px;font-weight:600;letter-spacing:3px;
    font-variant-numeric:tabular-nums;
  }
  .cd-status.run::before,
  .cd-status.final10::before,
  .cd-status.done::before{
    content:";
    position:absolute;left:50%;top:50%;
    width:320px;height:46px;margin-left:-160px;margin-top:-23px;
    background:rgba(255,255,255,.08);
    border-radius:10px;
    z-index:-1;
  }
  .cd-status.final{font-size:32px;color:#EDEDED;font-weight:600;letter-spacing:1px;}
  .cd-status.final10{font-size:32px;color:#FF453A;font-weight:700;letter-spacing:1px;}
  .cd-status.done{color:#FF453A;font-weight:700;font-size:26px;}
  @keyframes cdBlink{0%,100%{opacity:1;}50%{opacity:.35;}}
  .cd-status.done{animation:cdBlink 1.2s ease-in-out infinite;}

  #cdPanel{
    position:fixed;left:0;right:0;top:0;bottom:0;
    background:#000;
    display:none;z-index:20;
    text-align:center;
  }
  #cdPanel.on{display:block;}
  .cd-title{
    margin-top:88px;font-size:19px;color:#777;
    letter-spacing:6px;text-indent:6px;
  }
  .cd-big{
    margin-top:26px;display:none;
    font-family:"sans-serif-condensed",Roboto,sans-serif;
    font-weight:700;font-size:132px;line-height:1;
    color:#E4E4E4;letter-spacing:2px;
    font-variant-numeric:tabular-nums;
    -webkit-transform:scaleX(.86);transform:scaleX(.86);
    -webkit-transform-origin:50% 50%;transform-origin:50% 50%;
  }
  #cdPanel.runmode .cd-big{display:block;margin-top:60px;}
  #cdRun .cd-actions{margin-top:80px;}
  #cdPanel.runmode #cdSetup{display:none;}
  #cdPanel:not(.runmode) #cdRun{display:none;}

  /* 三列滚轮：时 / 分 / 秒 */
  .cd-wheels{
    position:relative;width:510px;margin:28px auto 0;
    height:154px;
  }
  .wbar{
    position:absolute;left:0;right:0;top:66px;height:44px;
    background:#262626;border-radius:12px;z-index:0;
  }
  .wcol{
    position:absolute;top:0;width:170px;
    z-index:1;
  }
  .wcol:nth-child(1){left:0;}
  .wcol:nth-child(2){left:170px;}
  .wcol:nth-child(3){left:340px;}
  .wcap{
    height:22px;line-height:22px;font-size:14px;color:#6E6E6E;
    letter-spacing:2px;
  }
  .wview{
    height:132px;overflow:hidden;position:relative;
  }
  .wlist{
    position:absolute;left:0;right:0;top:0;
  }
  .witem{
    height:44px;line-height:44px;
    font-family:"sans-serif-condensed",Roboto,sans-serif;
    font-size:26px;color:#7E7E7E;
    font-variant-numeric:tabular-nums;
  }
  .witem.sel{color:#F2F2F2;font-weight:600;}

  .cd-chips{margin-top:26px;text-align:center;}
  .cd-chip{
    display:inline-block;width:150px;height:38px;line-height:38px;
    margin:0 6px;
    background:#191919;border-radius:10px;
    font-size:18px;color:#AEAEAE;
    font-family:"sans-serif-condensed",Roboto,sans-serif;
    font-variant-numeric:tabular-nums;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
  }
  .cd-chip.sel{background:#2E2E2E;color:#F0F0F0;}
  .cd-chip.save{background:#3A3A3A;color:#FFFFFF;}
  .cd-hint{
    margin-top:14px;text-align:center;
    font-size:15px;color:#575757;letter-spacing:1px;
  }
  .cd-ring{
    margin-top:16px;text-align:center;
    font-size:17px;color:#8E8E8E;letter-spacing:1px;
  }
  .cd-ring .r-btn svg, .cd-ring .r-btn svg *{pointer-events:none;}
  .cd-ring .r-btn{
    display:inline-block;width:38px;height:38px;line-height:38px;
    text-align:center;vertical-align:middle;
    background:#191919;border-radius:9px;
  }
  .cd-ring .r-name{
    display:inline-block;min-width:112px;height:38px;line-height:38px;
    margin:0 8px;vertical-align:middle;
    font-size:17px;color:#D0D0D0;
  }
  .cd-ring .r-try{
    display:inline-block;height:38px;line-height:38px;padding:0 18px;
    margin-left:12px;vertical-align:middle;
    font-size:15px;color:#9C9C9C;
    background:#101010;border:1px solid #2A2A2A;border-radius:9px;
  }
  .cd-actions{margin-top:18px;}
  .cd-act{
    display:inline-block;width:150px;height:52px;line-height:52px;
    margin:0 10px;background:#1A1A1A;border-radius:26px;
    font-size:21px;color:#C8C8C8;
    box-shadow:0 6px 14px rgba(0,0,0,.45);
  }
  .cd-act.main{background:#E6E6E6;color:#101010;font-weight:600;}

  /* ===== 视图二：日历（同一套中性黑灰） ===== */
  .cal-card{
    background:#141414;
    border:1px solid rgba(255,255,255,.07);
    box-shadow:0 16px 34px rgba(0,0,0,.50), inset 0 1px 0 rgba(255,255,255,.05);
    border-radius:26px;
    padding:24px 44px 26px;
    width:884px;
  }
  .cal-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:14px;padding:0 6px;
  }
  .cal-month{font-size:36px;font-weight:600;color:#EDEDED;}
  .cal-month .yr{font-weight:400;color:#8E8E8E;font-size:26px;margin-right:8px;}
  .cal-weekno{font-size:19px;color:#8E8E8E;letter-spacing:1px;}

  table.cal{width:100%;border-collapse:collapse;table-layout:fixed;}
  table.cal col{width:14.2857%;}
  table.cal thead th{
    font-size:19px;font-weight:500;color:#8E8E8E;
    padding:0 0 8px;letter-spacing:1px;
  }
  table.cal thead th.sun{color:#FF453A;}
  table.cal td{
    height:54px;text-align:center;vertical-align:middle;
    font-family:"sans-serif-light",Roboto,sans-serif;
    font-size:29px;font-weight:400;color:#E4E4E4;
    font-variant-numeric:tabular-nums;
  }
  table.cal td.out{color:#5A5A5A;}
  table.cal td.today span{
    display:inline-block;min-width:50px;height:50px;line-height:50px;
    border-radius:25px;background:#FF453A;color:#fff;font-weight:500;
    padding:0 2px;
  }

  #dots{
    position:fixed;left:0;right:0;bottom:20px;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
    z-index:5;
  }
  #dots i{
    pointer-events:auto;
    display:block;width:8px;height:8px;border-radius:4px;
    background:rgba(255,255,255,.24);margin:0 5px;
    transition:background .3s,width .3s;
  }
  #dots i.on{background:rgba(255,255,255,.85);width:20px;}

  /* ===== 番茄钟（主界面只有右下角一个 🍅，开关在独立面板） ===== */
  #pomoBtn{
    position:fixed;right:16px;top:489px;width:84px;height:60px;z-index:20;
    text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  #pomoBtn .pm-ico{
    display:block;font-size:34px;line-height:46px;margin-top:4px;
    -webkit-user-select:none;user-select:none;
    -webkit-filter:grayscale(.15);
  }
  #pomoBtn.run .pm-ico{opacity:.55;}
  #pomoBtn .pm-bar{display:none;width:22px;height:2px;margin:2px auto 0;background:#FF453A;border-radius:1px;}
  #pomoBtn.run .pm-bar{display:block;}

  #pomoPanel{position:fixed;top:0;left:0;right:0;bottom:0;background:#BA4949;z-index:21;display:none;}
  #pomoPanel.focus{background:#BA4949;}
  #pomoPanel.short{background:#38858A;}
  #pomoPanel.long{background:#397097;}
  #pomoPanel.on{display:block;}

  .pm-modes{margin-top:84px;text-align:center;}
  .pm-mode{
    display:inline-block;width:150px;height:50px;line-height:50px;margin:0 6px;
    border-radius:25px;font-size:21px;color:rgba(255,255,255,.86);background:rgba(255,255,255,.16);
    font-family:"sans-serif-condensed",Roboto,sans-serif;
  }
  .pm-mode.on{background:#FFFFFF;color:#333333;}

  .pm-time{
    margin-top:24px;text-align:center;
    font-family:"sans-serif-condensed",Roboto,sans-serif;
    font-size:160px;font-weight:600;color:#FFFFFF;line-height:176px;
    font-variant-numeric:tabular-nums;
    -webkit-transform:scaleX(.92);
  }
  .pm-time.idle{color:rgba(255,255,255,.93);}

  .pm-round{margin-top:10px;text-align:center;height:36px;}
  .pm-round i{display:inline-block;width:40px;font-style:normal;font-size:30px;line-height:36px;opacity:.34;}
  .pm-round i.on{opacity:1;}

  .pm-acts{margin-top:36px;text-align:center;}
  .pm-act{
    display:inline-block;height:58px;line-height:58px;padding:0 32px;margin:0 7px;
    border-radius:29px;font-size:22px;color:#FFFFFF;background:rgba(255,255,255,.16);
    font-family:"sans-serif-condensed",Roboto,sans-serif;
  }
  .pm-act.main{background:#FFFFFF;font-weight:600;}
  #pomoPanel.focus .pm-act.main{color:#BA4949;}
  #pomoPanel.short .pm-act.main{color:#38858A;}
  #pomoPanel.long .pm-act.main{color:#397097;}

  .pm-hint{margin-top:22px;text-align:center;font-size:15px;line-height:24px;color:rgba(255,255,255,.74);font-family:"sans-serif-condensed",Roboto,sans-serif;}

  #pmCfgBox{position:fixed;top:0;left:0;right:0;bottom:0;background:#BA4949;z-index:22;display:none;}
  #pmCfgBox.focus{background:#BA4949;}
  #pmCfgBox.short{background:#38858A;}
  #pmCfgBox.long{background:#397097;}
  #pmCfgBox.on{display:block;}
  #pmCfgBox.focus .pm-act.main{color:#BA4949;}
  #pmCfgBox.short .pm-act.main{color:#38858A;}
  #pmCfgBox.long .pm-act.main{color:#397097;}

  .pm-cfg-title{margin-top:54px;text-align:center;font-size:21px;color:rgba(255,255,255,.82);letter-spacing:6px;font-family:"sans-serif-condensed",Roboto,sans-serif;}
  .pm-row{margin-top:10px;text-align:center;height:48px;line-height:48px;}
  .pm-row label{display:inline-block;width:140px;text-align:right;font-size:19px;color:rgba(255,255,255,.86);margin-right:14px;font-family:"sans-serif-condensed",Roboto,sans-serif;}
  .pm-step{display:inline-block;width:48px;height:48px;line-height:48px;border-radius:12px;background:rgba(255,255,255,.16);color:#FFFFFF;font-size:26px;}
  .pm-val{display:inline-block;width:104px;height:48px;line-height:48px;font-size:21px;color:#FFFFFF;font-variant-numeric:tabular-nums;font-family:"sans-serif-condensed",Roboto,sans-serif;}
  .pm-row2{margin-top:14px;text-align:center;font-size:19px;color:rgba(255,255,255,.86);height:48px;line-height:48px;font-family:"sans-serif-condensed",Roboto,sans-serif;}
  .pm-toggle{display:inline-block;width:84px;height:48px;line-height:48px;border-radius:12px;background:rgba(255,255,255,.16);color:#FFFFFF;margin-left:16px;font-size:19px;}
  .pm-toggle.on{background:#FFFFFF;color:#333333;}
  .pm-clearbtn{display:inline-block;height:48px;line-height:48px;padding:0 24px;margin-left:16px;border-radius:12px;background:rgba(255,255,255,.16);color:#FFFFFF;font-size:19px;}
</style>
</head>
<body>
<div id="wrap">
  <div id="track">

    <!-- ===== 视图：翻页钟 ===== -->
    <section class="page">
      <div class="day-line" id="dayLine"></div>
      <div class="date-line" id="dateLine">2026年11月8日</div>
      <div class="week-line" id="weekLine"></div>
      <div class="tiles">
        <div class="tile"><div class="digits" id="dH">19</div><div class="shade"></div><div class="seam"></div></div>
        <div class="tile"><div class="digits" id="dM">05</div><div class="shade"></div><div class="seam"></div></div>
        <div class="tile"><div class="digits" id="dS">42</div><div class="shade"></div><div class="seam"></div></div>
      </div>
      <div class="cd-status" id="cdStatus"></div>
      <div class="caption">×××</div>

      <div id="cdQuick">
        <span class="icbtn" id="qStart"><svg viewBox="0 0 24 24"><path d="M8.5 6 L18 12 L8.5 18 Z"/></svg></span>
        <span class="icbtn" id="qStop"><svg viewBox="0 0 24 24"><rect x="7.5" y="7.5" width="9" height="9"/></svg></span>
        <span class="icbtn" id="qSet"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="6.2"/><line x1="12" y1="13.5" x2="12" y2="10"/><line x1="8" y1="4.2" x2="16" y2="4.2"/></svg></span>
      </div>
    </section>

    <!-- ===== 视图：日历 ===== -->
    <section class="page">
      <div class="cal-card">
        <div class="cal-head">
          <div class="cal-month"><span class="yr" id="calYear">2026</span><span id="calMonth">11月</span></div>
          <div class="cal-weekno">第 <span id="calWeek">45</span> 周</div>
        </div>
        <table class="cal">
          <colgroup>
            <col><col><col><col><col><col><col>
          </colgroup>
          <thead>
            <tr>
              <th class="sun">日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th>
            </tr>
          </thead>
          <tbody id="calBody"></tbody>
        </table>
      </div>
    </section>

  </div>
</div>

<div id="dots"><i class="on"></i><i></i></div>

<div id="cdPanel">
  <div class="cd-title">倒计时</div>
  <div class="cd-big" id="cdBig">05:00</div>

  <div id="cdSetup">
    <div class="cd-wheels">
      <div class="wcol"><div class="wcap">小时</div><div class="wview" id="wvH"><div class="wlist" id="wlH"></div></div></div>
      <div class="wcol"><div class="wcap">分钟</div><div class="wview" id="wvM"><div class="wlist" id="wlM"></div></div></div>
      <div class="wcol"><div class="wcap">秒</div><div class="wview" id="wvS"><div class="wlist" id="wlS"></div></div></div>
      <div class="wbar"></div>
    </div>
    <div class="cd-chips" id="cdChips"></div>
    <div class="cd-hint">点＝选用　按住约 0.7 秒＝把当前时长存到这一格</div>
    <div class="cd-ring">
      <span class="r-btn" id="rPrev"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M14.5 5 L8 12 L14.5 19" fill="none" stroke="#8E8E8E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="r-name" id="rName">倒影</span><span class="r-btn" id="rNext"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M9.5 5 L16 12 L9.5 19" fill="none" stroke="#8E8E8E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="r-try" id="rTry">试听</span>
    </div>

<script>
(function(){
  var WEEK_CN = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  var track = document.getElementById('track');
  var dots = document.getElementById('dots').getElementsByTagName('i');
  var idx = 0;
  var calKey = '';
  var weekShown = -1;
  var dayShown = '';

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function isoWeek(d){
    var t = new Date(d.getTime());
    t.setHours(0,0,0,0);
    t.setDate(t.getDate() + 3 - (t.getDay() + 6) % 7);
    var week1 = new Date(t.getFullYear(), 0, 4);
    return 1 + Math.round(((t - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
  }

  function setPage(n, animate){
    idx = n;
    if (animate === false) { track.style.transition = 'none'; }
    else { track.style.transition = 'transform .42s cubic-bezier(.22,.61,.36,1)'; }
    track.style.transform = 'translateX(' + (-50 * n) + '%)';
    for (var i = 0; i < dots.length; i++) { dots[i].className = (i === n) ? 'on' : ''; }
    if (animate === false) {
      setTimeout(function(){ track.style.transition = 'transform .42s cubic-bezier(.22,.61,.36,1)'; }, 60);
    }
  }

  /* ---- 时钟 ---- */
  function tick(){
    var now = new Date();
    var y = now.getFullYear(), mo = now.getMonth() + 1, da = now.getDate();
    document.getElementById('dH').textContent = pad(now.getHours());
    document.getElementById('dM').textContent = pad(now.getMinutes());
    document.getElementById('dS').textContent = pad(now.getSeconds());
    document.getElementById('dateLine').textContent =
      y + '年' + mo + '月' + da + '日';
    var wd = WEEK_CN[now.getDay()];
    if (wd !== dayShown) {
      dayShown = wd;
      document.getElementById('dayLine').textContent = wd;
    }
    var wk = isoWeek(now);
    if (wk !== weekShown) {
      weekShown = wk;
      document.getElementById('weekLine').textContent = '第 ' + wk + ' 周';
    }
    if (calKey !== y + '-' + mo) { renderCalendar(now); }

    /* 倒计时：每秒刷新；到点转成“时间到” */
    if (cdRunning) {
      if (now.getTime() >= cdEnd) { cdRunning = false; cdDone = true; cdSaveState(); alarmStart(); }
    }
    cdRender();
  }

  /* ---- 日历 ---- */
  function renderCalendar(now){
    var y = now.getFullYear(), m = now.getMonth();
    calKey = y + '-' + m;
    document.getElementById('calYear').textContent = y;
    document.getElementById('calMonth').textContent = (m + 1) + '月';
    document.getElementById('calWeek').textContent = isoWeek(now);

    var startOffset = new Date(y, m, 1).getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var prevDays = new Date(y, m, 0).getDate();
    var tbody = document.getElementById('calBody');
    var html = '', cell = 0;
    var rows = Math.ceil((startOffset + daysInMonth) / 7);

    for (var r = 0; r < rows; r++) {
      html += '<tr>';
      for (var c = 0; c < 7; c++) {
        cell++;
        var d = cell - startOffset;
        if (d < 1 || d > daysInMonth) {
          html += '<td class="out">' + ((d < 1) ? (prevDays + d) : (d - daysInMonth)) + '</td>';
        } else {
          html += '<td' + (d === now.getDate() ? ' class="today"' : '') + '><span>' + d + '</span></td>';
        }
      }
      html += '</tr>';
    }
    tbody.innerHTML = html;
  }

  function Wheel(viewId, listId, count){

  };

      self.go(base - Math.round(dy / ROW));
    };
  };

      if (!raw) { pm.left = pmDur('focus'); return; }
      var o = JSON.parse(raw);
      if (o && o.cfg) {
        for (var k in o.cfg) { if (pmCfg[k] !== undefined) { pmCfg[k] = o.cfg[k]; } }
      }
      if (o && o.state) {
        pm.mode = o.state.mode || 'focus';
        pm.round = o.state.round || 0;
        pm.running = !!o.state.running;
        pm.end = o.state.end || 0;
        pm.left = o.state.left || 0;
        if (pm.running) {
          if (pm.end > pmNow()) { pm.left = Math.ceil((pm.end - pmNow()) / 1000); }
          else { pm.running = false; pm.left = pmDur(pm.mode); }
        }
      }
      if (!pm.left) { pm.left = pmDur(pm.mode); }
    } catch (e) { pm.left = pmDur(pm.mode); }
  }
  function pmSave(){
    try {
      localStorage[PMO_KEY] = JSON.stringify({
        cfg: pmCfg,
        state: { mode: pm.mode, end: pm.end, left: pm.left, running: pm.running, round: pm.round }
      });
    } catch (e) {}
  }

  function pmPaint(){
    if (pm.running) { pm.left = Math.max(0, Math.ceil((pm.end - pmNow()) / 1000)); }
    var tm = document.getElementById('pmTime');
    tm.textContent = pmFmt(pm.left);
    tm.className = 'pm-time' + (pm.mode === 'focus' ? '' : ' brk') + (pm.running ? '' : ' idle');

    var ms = document.getElementById('pmModes').getElementsByTagName('span');
    for (var i = 0; i < ms.length; i++) {
      ms[i].className = 'pm-mode' + (ms[i].getAttribute('data-m') === pm.mode ? ' on' : '');
    }
    var filled = pm.round % pmCfg.gap;
    var dots = '';
    for (var d = 0; d < pmCfg.gap; d++) { dots += '<i class="' + (d < filled ? 'on' : '') + '">🍅</i>'; }
    document.getElementById('pmRound').innerHTML = dots;
    document.getElementById('pmStart').textContent = pm.running ? '暂停' : '开始';

    var btn = document.getElementById('pomoBtn');
    btn.className = pm.running ? 'run' : '';
    var pn = document.getElementById('pomoPanel');
    if (pn.className.indexOf('on') >= 0) { pn.className = 'on ' + pm.mode; }
    var cb = document.getElementById('pmCfgBox');
    if (cb.className.indexOf('on') >= 0) { cb.className = 'on ' + pm.mode; }
  }

  function pmStart(){
    audioWake(); ringPrepare();          /* 手势里拿 running 上下文并预解码 */
    if (pm.left <= 0) { pm.left = pmDur(pm.mode); }
    pm.end = pmNow() + pm.left * 1000;
    pm.running = true;
    pmSave(); pmPaint();
  }
  function pmPause(){
    if (pm.running) { pm.left = Math.max(0, Math.ceil((pm.end - pmNow()) / 1000)); }
    pm.running = false; pmSave(); pmPaint();
  }
  function pmReset(){
    pm.running = false; pm.left = pmDur(pm.mode); pmSave(); pmPaint();
  }
  function pmSwitch(m){
    pm.mode = m; pm.running = false; pm.left = pmDur(m); pmSave(); pmPaint();
  }
  function pmRingStop(){
    if (pmRingTimer) { clearTimeout(pmRingTimer); pmRingTimer = null; }
    ringStop();
  }
  function pmChime(){
    pmRingStop();
    ringFail = false;
    ringPlay();
    /* 铃声没能解码就退回蜂鸣，保证一定有声（与倒计时的兜底一致） */
    setTimeout(function(){
      if (pmRingTimer && (ringFail || !ringSrc)) { beepLoop(); }
    }, 1500);
    pmRingTimer = setTimeout(function(){
      ringStop();
      if (beepTimer) { clearInterval(beepTimer); beepTimer = null; }
      pmRingTimer = null;
    }, 6000);
  }
  function pmNext(){
    if (pm.mode === 'focus') {
      pm.round++;
      pm.mode = (pm.round % pmCfg.gap === 0) ? 'long' : 'short';
    } else {
      pm.mode = 'focus';
    }
    pm.left = pmDur(pm.mode);
    pm.running = false;
    if (pmCfg.auto) { pm.end = pmNow() + pm.left * 1000; pm.running = true; }
    pmSave();
  }
  function pmTick(){
    if (!pm.running) { return; }
    if (pm.end - pmNow() <= 0) {
      pm.left = 0;
      pmPaint();
      pmChime();
      pmNext();
      pmPaint();
      return;
    }
    pmPaint();
  }

  function pmOpen(){
    document.getElementById('pomoPanel').className = 'on ' + pm.mode;
    pmPaint();
  }
  function pmClose(){
    document.getElementById('pomoPanel').className = '';
    document.getElementById('pmCfgBox').className = '';
    window.PM_CLOSE_T = new Date().getTime();   /* 面板隐藏后同点位的合成 click 会穿透到底层，挡一下 */
  }
  function pmHint(){
    document.getElementById('pmHint1').textContent = '专注 ' + pmCfg.focus + ' 分 + 短休 ' + pmCfg.short + ' 分，每 ' + pmCfg.gap + ' 轮长休 ' + pmCfg.long + ' 分';
  }
  function pmCfgPaint(){
    pmHint();
    document.getElementById('pmVfocus').textContent = pmCfg.focus + ' 分';
    document.getElementById('pmVshort').textContent = pmCfg.short + ' 分';
    document.getElementById('pmVlong').textContent = pmCfg.long + ' 分';
    document.getElementById('pmVgap').textContent = pmCfg.gap + ' 轮';
    document.getElementById('pmVround').textContent = pm.round + ' 个';
    var au = document.getElementById('pmAuto');
    au.className = 'pm-toggle' + (pmCfg.auto ? ' on' : '');
    au.textContent = pmCfg.auto ? '开' : '关';
  }
  function pmStep(k, d){
    var lim = { focus: [5, 90], short: [1, 30], long: [5, 60], gap: [2, 8] };
    var v = pmCfg[k] + d;
    if (v < lim[k][0]) { v = lim[k][0]; }
    if (v > lim[k][1]) { v = lim[k][1]; }
    pmCfg[k] = v;
    if (k !== 'gap' && !pm.running) { pm.left = pmDur(pm.mode); }
    pmSave(); pmCfgPaint(); pmPaint();
  }

  qbind(document.getElementById('pomoBtn'), pmOpen);
  qbind(document.getElementById('pmBack'), pmClose);
  qbind(document.getElementById('pmStart'), function(){ if (pm.running) { pmPause(); } else { pmStart(); } });
  qbind(document.getElementById('pmReset'), pmReset);
  qbind(document.getElementById('pmCfgBtn'), function(){
    document.getElementById('pmCfgBox').className = 'on ' + pm.mode;
    pmCfgPaint();
  });
  qbind(document.getElementById('pmCfgDone'), function(){
    document.getElementById('pmCfgBox').className = '';
    pmSave(); pmPaint();
  });
  qbind(document.getElementById('pmClear'), function(){
    pm.round = 0; pmSave(); pmCfgPaint(); pmPaint();
  });
  qbind(document.getElementById('pmAuto'), function(){
    pmCfg.auto = !pmCfg.auto; pmSave(); pmCfgPaint();
  });

  (function(){
    var ms = document.getElementById('pmModes').getElementsByTagName('span');
    for (var i = 0; i < ms.length; i++) {
      (function(sp){
        qbind(sp, function(){ pmSwitch(sp.getAttribute('data-m')); });
      })(ms[i]);
    }
    var steps = document.getElementById('pmCfgBox').getElementsByTagName('span');
    for (var j = 0; j < steps.length; j++) {
      if (steps[j].className.indexOf('pm-step') < 0) { continue; }
      (function(sp){
        qbind(sp, function(){ pmStep(sp.getAttribute('data-k'), parseInt(sp.getAttribute('data-d'), 10)); });
      })(steps[j]);
    }
  })();

  pmLoad();
  pmCfgPaint();
  pmPaint();
  setInterval(pmTick, 500);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', pmInit, false);
  } else {
    pmInit();
  }
</script>

<!-- ===== 番茄钟：主界面只有一个 🍅 按钮 ===== -->
<div id="pomoBtn"><span class="pm-ico">🍅</span><span class="pm-bar"></span></div>

<div id="pomoPanel">
  <div class="pm-modes" id="pmModes">
    <span class="pm-mode on" data-m="focus">番茄钟</span><span class="pm-mode" data-m="short">短休</span><span class="pm-mode" data-m="long">长休</span>
  </div>
  <div class="pm-time idle" id="pmTime">25:00</div>
  <div class="pm-round" id="pmRound"></div>
  <div class="pm-acts">
    <span class="pm-act main" id="pmStart">开始</span><span class="pm-act" id="pmReset">重置</span><span class="pm-act" id="pmCfgBtn">设置</span><span class="pm-act" id="pmBack">返回</span>
  </div>
  <div class="pm-hint"><span id="pmHint1">25 分钟专注 + 5 分钟休息，每 4 轮长休一次</span><br>铃声沿用倒计时里选的那一首</div>
</div>

<div id="pmCfgBox">
  <div class="pm-cfg-title">时长设置</div>
  <div class="pm-row"><label>专注</label><span class="pm-step" data-k="focus" data-d="-5">−</span><span class="pm-val" id="pmVfocus">25 分</span><span class="pm-step" data-k="focus" data-d="5">+</span></div>
  <div class="pm-row"><label>短休</label><span class="pm-step" data-k="short" data-d="-1">−</span><span class="pm-val" id="pmVshort">5 分</span><span class="pm-step" data-k="short" data-d="1">+</span></div>
  <div class="pm-row"><label>长休</label><span class="pm-step" data-k="long" data-d="-5">−</span><span class="pm-val" id="pmVlong">15 分</span><span class="pm-step" data-k="long" data-d="5">+</span></div>
  <div class="pm-row"><label>长休间隔</label><span class="pm-step" data-k="gap" data-d="-1">−</span><span class="pm-val" id="pmVgap">4 轮</span><span class="pm-step" data-k="gap" data-d="1">+</span></div>
  <div class="pm-row2">自动开始下一段<span class="pm-toggle on" id="pmAuto">开</span></div>
  <div class="pm-row2">已完成的番茄<span class="pm-val" id="pmVround">0 个</span><span class="pm-clearbtn" id="pmClear">清零</span></div>
  <div class="pm-acts"><span class="pm-act main" id="pmCfgDone">完成</span></div>
</div></body>
</html>
